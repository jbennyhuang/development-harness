name: Check
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pyright
      - run: uv run pytest -q
      - run: uv build
