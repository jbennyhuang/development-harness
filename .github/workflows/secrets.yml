name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          cd "$scan_dir"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks_8.30.1_linux_x64.tar.gz
          # SHA-256 from the official v8.30.1 release checksums.
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          install -m 755 gitleaks "$RUNNER_TEMP/gitleaks"
          rm -rf "$scan_dir"
      - name: Scan all fetched history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .'
