[tools]
uv = "0.13.0"
node = "24.21.0"
"github:gastownhall/beads" = "1.3.1"
"github:zjrosen/perles" = { version = "0.8.97", os = ["linux", "macos"] }
"github:dolthub/dolt" = "2.4.2"

[tasks.check]
description = "Run lint and deterministic regression tests"
run = ["uv run ruff check .", "uv run pytest"]

[tasks.build]
description = "Build the Python executable package"
run = "uv build"
